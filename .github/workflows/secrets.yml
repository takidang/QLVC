name: Secrets

# Quét bí mật cho mọi thay đổi, kể cả chỉ sửa tài liệu
on:
  push:
    branches: [main, dev, test, hotfix]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Chạy thẳng binary gitleaks (ghim phiên bản + checksum) thay vì gitleaks-action
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tar.gz" | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
