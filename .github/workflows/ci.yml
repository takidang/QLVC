name: CI

# Nhánh làm việc chỉ chạy qua PR (trước đây push + PR chạy hai lần giống nhau).
# PR chỉ sửa tài liệu (vd. PR tiến độ) bỏ qua; quét bí mật vẫn chạy ở secrets.yml.
# Tiết kiệm phút Actions: PR chỉ đụng frontend/ thì bỏ qua pytest (~9 phút), và ngược lại.
on:
  push:
    branches: [main, dev, test, hotfix]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# Đẩy thêm commit lên cùng PR thì hủy lượt đang chạy dở
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL chỉ sống trong job CI; mật khẩu không phải bí mật thật
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: qlvc
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qlvc
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://qlvc:postgres@127.0.0.1:5432/qlvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Job vẫn báo xanh khi bỏ qua (không bắt buộc check nào). Push nhánh dài hạn: luôn chạy.
      # PR: so với đầu nhánh đích; sửa chính workflow này thì chạy cả hai phía.
      - name: Có đổi backend/ không
        id: doi
        env:
          GOC: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$GOC" ]; then echo "chay=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$GOC"
          if git diff --name-only "$GOC" HEAD | grep -qE '^(backend/|\.github/workflows/ci\.yml)'; then
            echo "chay=true" >> "$GITHUB_OUTPUT"
          else
            echo "chay=false" >> "$GITHUB_OUTPUT"
            echo "PR không đổi backend/ nên bỏ qua." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.doi.outputs.chay == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: steps.doi.outputs.chay == 'true'
        run: pip install -r requirements-dev.txt
      # Sinh khóa ngẫu nhiên mỗi lần chạy, không ghi khóa vào repo
      - if: steps.doi.outputs.chay == 'true'
        run: echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - if: steps.doi.outputs.chay == 'true'
        run: ruff check .
      - if: steps.doi.outputs.chay == 'true'
        run: ruff format --check .
      # Migration chạy được và khớp models (không quên tạo migration khi sửa models)
      - if: steps.doi.outputs.chay == 'true'
        run: alembic upgrade head && alembic check
      - if: steps.doi.outputs.chay == 'true'
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Có đổi frontend/ không
        id: doi
        env:
          GOC: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$GOC" ]; then echo "chay=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$GOC"
          if git diff --name-only "$GOC" HEAD | grep -qE '^(frontend/|\.github/workflows/ci\.yml)'; then
            echo "chay=true" >> "$GITHUB_OUTPUT"
          else
            echo "chay=false" >> "$GITHUB_OUTPUT"
            echo "PR không đổi frontend/ nên bỏ qua." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.doi.outputs.chay == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.doi.outputs.chay == 'true'
        run: npm ci
      - if: steps.doi.outputs.chay == 'true'
        run: npm run lint
      - if: steps.doi.outputs.chay == 'true'
        run: npm run format
      - if: steps.doi.outputs.chay == 'true'
        run: npm run build
